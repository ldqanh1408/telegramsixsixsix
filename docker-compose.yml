services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegrambots:local
    container_name: telegrambots-app
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/telegrambots
      SPRING_MONGODB_URI: mongodb://mongo:27017/telegrambots
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-local-admin-token}
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: telegrambots-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: telegrambots-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "app:8080"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - app

volumes:
  mongo_data:
